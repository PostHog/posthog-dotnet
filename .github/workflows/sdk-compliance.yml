name: SDK Compliance Tests

permissions:
  contents: read
  packages: read
  pull-requests: write

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  compliance:
    name: PostHog SDK compliance tests
    uses: PostHog/posthog-sdk-test-harness/.github/workflows/test-sdk-action.yml@aa725c89eec72cb8ac75f4e418662bf2e161feb8
    with:
      adapter-dockerfile: "sdk_compliance_adapter/Dockerfile"
      adapter-context: "."
      test-harness-version: "1.0.0"
      report-name: "sdk-compliance-report-dotnet-v0"

  coverage-inventory:
    name: Verify compliance test inventory
    needs: compliance
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test coverage checks
        run: python3 -m unittest discover -s sdk_compliance_adapter -p 'test_*.py'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-compliance-report-dotnet-v0
          path: report
      - name: Verify all 47 tests were selected
        run: python3 sdk_compliance_adapter/check_coverage.py --report report/sdk-compliance-report.md
