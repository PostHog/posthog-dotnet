name: .NET SDK benchmark report

on:
  workflow_run:
    workflows: ['.NET SDK benchmarks']
    types: [completed]

permissions: {}

jobs:
  report:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: PostHog/.github/.github/workflows/sdk-benchmark-report.yml@36c59a0045926b2dc82566cafb96721a0e808673 # SDK benchmark reporting
    with:
      workflow-path: .github/workflows/benchmarks.yml
      artifact-name: dotnet-benchmark-results
      report-key: posthog-dotnet
      sdk: posthog-dotnet
