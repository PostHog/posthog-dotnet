name: .NET SDK benchmark report

on:
  workflow_run:
    workflows: ['.NET SDK benchmarks']
    types: [completed]

permissions: {}

jobs:
  report:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: PostHog/.github/.github/workflows/sdk-benchmark-report.yml@3f246f68984d70e68aa54b2f7dd2d26a02c54f3f # SDK benchmark reporting
    with:
      workflow-path: .github/workflows/benchmarks.yml
      artifact-name: dotnet-benchmark-results
      report-key: posthog-dotnet
      sdk: posthog-dotnet
